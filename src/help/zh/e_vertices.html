<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	
	<title>顶点模式</title>
	
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" type="text/css" href="default.css" media="screen" title="Default" />
	<script type="text/javascript" src="scripts.js"></script>
</head>
<body onresize="autoadjustheight('classiccontrols')">
	
	
	
	<div id="title"><h1>顶点模式</h1></div>
	
	<div id="contents">
	<p>
		此编辑模式允许你编辑地图中的顶点。你可以插入新顶点，它们会自动分割线段；删除仅连接两条线段的顶点时，这些线段会正确重新连接。拖动顶点即可移动它们，并将其吸附到<a href="w_gridsetup.html">网格</a>和几何体。按住 Shift 和/或 Control 可以禁用对网格和几何体的吸附。<br />
		<br />
		顶点编辑模式是经典（2D）编辑模式之一。
		
		<h2>默认控制</h2>
		<table border="0" cellspacing="6" width="90%">
		<tr>
			<td width="150" valign="top"><b>V</b></td>
			<td>从任意其他经典编辑模式切换到此模式。</td>
		</tr>
		<tr>
			<td valign="top"><b>Insert</b></td>
			<td>在鼠标坐标处插入新顶点。当靠近线段时，该线段将被此顶点分割。</td>
		</tr>
		<tr>
			<td valign="top"><b>Delete</b></td>
			<td>删除选中的顶点。请注意，这也可能移除相连的线段并破坏你的扇区。</td>
		</tr>
		</table>
		<iframe src="classiccontrols.html" frameborder="0" width="100%" id="classiccontrols" scrolling="no" onload="autoadjustheight('classiccontrols')"></iframe>
	</p>
	</div>
</body>
