"当设置了固定圆弧（Fixed Circular Curve）时，<b>CTRL+ALT+右键拖动</b>可同时增减分割顶点与曲线的角度，以保持一致的圆弧形状。"
"按 <k>builder_acceptmode</k> 确认"
"按 <k>builder_cancelmode</k> 或 <k>builder_classicedit</k> 取消"
