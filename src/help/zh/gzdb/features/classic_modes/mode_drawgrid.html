<body>
	
	
	
	<div id="gz_title">
	  <h1>绘制网格模式</h1>
	</div>
	
	<div id="contents">
    <p>此模式让你绘制网格。<br />
      <b>菜单路径：</b>模式 -&gt; 绘制网格。<br>
      <b>动作类别：</b>绘制。<br />
      <b>默认按键：</b>无。<br />
      <b>附加动作：</b>提高细分级别、降低细分级别、增大拐角斜切、减小拐角斜切。</p>
    <p>你可以使用侧面板或&quot;<strong>提高/降低细分级别</strong>&quot;和&quot;<strong>增大/减小拐角斜切</strong>&quot;动作来改变水平和垂直切片数量。<br />
    更改"<strong>将切片锁定到网格</strong>"设置，可让切片数量在水平、垂直或两个方向上匹配当前网格大小。<br />
    如果你想创建三角形而不是四边形，请勾选&quot;<strong>三角化</strong>&quot;。<br />
	勾选"<strong>连续绘制</strong>"，可在绘制完成后禁用自动切换回之前的编辑模式。</p>
    <p><img src="draw_grid_tri.jpg" alt="" /></p>
</div>
