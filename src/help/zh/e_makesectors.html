<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	
	<title>创建扇区模式</title>
	
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" type="text/css" href="default.css" media="screen" title="Default" />
	<script type="text/javascript" src="scripts.js"></script>
</head>
<body>
	
	
	
	<div id="title"><h1>创建扇区模式</h1></div>
	
	<div id="contents">
	<p>
		使用此模式，你可以仅从现有几何体创建新扇区。这对于修复损坏的扇区、将单个扇区中的岛屿拆分为多个扇区，或从封闭的空白区域创建扇区很有用。当鼠标在地图上移动时，可能的扇区会高亮显示。使用 <b title="鼠标左键">LMB</b> 创建新扇区。<br />
		<br />
		创建扇区编辑模式是经典（2D）编辑模式之一。
		
		<h2>默认控制</h2>
		<table border="0" cellspacing="6" width="90%">
		<tr>
			<td width="150" valign="top"><b>M</b></td>
			<td>从任意其他经典编辑模式切换到此模式。</td>
		</tr>
		<tr>
			<td valign="top"><b title="鼠标左键">LMB</b></td>
			<td>单击以创建新的封闭扇区。</td>
		</tr>
		<tr>
			<td valign="top"><b title="鼠标右键">RMB</b></td>
			<td>单击以创建新的封闭扇区并编辑其属性。</td>
		</tr>
		</table>
	</p>
	</div>
</body>
