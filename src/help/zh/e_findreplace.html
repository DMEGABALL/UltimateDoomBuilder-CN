	<title>查找 &amp; 替换模式</title>

	<link rel="stylesheet" type="text/css" href="default.css" media="screen" title="Default" />
	<script type="text/javascript" src="scripts.js"></script>

<body>
	
	
	
	<div id="title"><h1>查找 &amp; 替换模式</h1></div>
	
	<div id="contents">
	<p>
		在寻找什么吗？这就是你用来快速查找地图中特定元素所需的模式。此模式可在任意经典模式中通过 <b>F3</b> 打开，并显示一个可用于查找项目的对话框。在对话框顶部选择要执行的搜索类型，然后输入你要查找的值。根据搜索类型的不同，你可以单击浏览按钮从浏览器中选择。如果想把找到的元素值替换为另一个值，请勾选 <b>Replace</b> 复选框。单击 Find / Replace 按钮执行搜索。<br />
		<br />
		结果将显示在打开的列表中。单击其中一个结果可放大到该特定元素。你也可以将焦点切换到主窗口并滚动或缩放地图，以查看选中的元素。单击 <b>Edit Selection</b> 按钮可编辑选中的元素。
	</p>
	</div>
</body>
