<body>

<div id="gz_title">
  <h1>“贴合贴图”动作</h1>
</div>
<div id="contents">
  <p><strong>动作名称：</strong>贴合贴图（Fit Textures）。<br />
    <b>动作类别：</b>视觉模式。<br />
    <b>默认按键：</b>Ctrl-Alt-A。</p>
  <p>此动作可让你在视觉模式中将贴图对齐到选中的表面（Surface）。“<em>贴合相连表面</em>”设置控制是否将共享同一贴图的相邻表面视为一个连续表面。</p>
  <p><strong>示例：</strong><br /><br />
  初始设置：<br />
  <img src="texturefit1.jpg"/></p><br />
  <p>各种设置的实际效果示例：<br />
  <img src="texturefit2.jpg"/></p>
<br /> 
  <img src="texturefit3.jpg"/>
<br />
  <img src="texturefit4.jpg"/>
<br />
  <img src="texturefit5.jpg"/>
</div>
</body>
</html>
