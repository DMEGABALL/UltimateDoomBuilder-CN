	<title>地图分析模式</title>
	
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" type="text/css" href="default.css" media="screen" title="Default" />
	<script type="text/javascript" src="scripts.js"></script>

<body>
	
	
	
	<div id="title"><h1>地图分析模式</h1></div>
	
	<div id="contents">
	<p>
		此模式有助于查找地图中的问题。它会显示一个小对话框，其中包含你希望执行的检查。在任意经典模式中按 <b>F4</b> 可切换到此模式。选择要执行的检查，然后单击 <b>Start Analysis</b> 按钮。发现的问题会显示在列表中。单击其中一个问题可放大到相应对象，并在列表下方显示该问题的说明。对于某些问题，说明下方会出现按钮，可用于快速修复该问题。
	</p>
	</div>
</body>
