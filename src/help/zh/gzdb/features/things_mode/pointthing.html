<body>

	
	
	<div id="gz_title">
	  <h1>将物件指向光标</h1>
</div>
	
<div id="contents">
	<p>此动作可用于在物件模式中快速调整物件的朝向。按住 Ctrl 键可让物件背向光标。<br />
      <b>菜单：</b>物件 -&gt; 指向光标。<br />
      <b>动作类别：</b>物件。<br />
      <b>默认按键：</b>Shift+L。</p>
	<p><strong>示例：</strong><br />
	选中物件，并将鼠标光标放置在你希望物件朝向的位置：<br /><img src="thing_lookat1.jpg" alt="" width="273" height="243" /></p>
	<p>按下该动作的快捷键：<br /><img src="thing_lookat2.jpg" alt="" width="278" height="245" /></p>
</div>
</body>
</html>
