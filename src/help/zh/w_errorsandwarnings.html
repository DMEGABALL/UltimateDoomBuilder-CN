<head>
	
	<title>错误和警告窗口</title>
	
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" type="text/css" href="default.css" media="screen" title="Default" />
</head>
<body>
	
	
	
	<div id="title"><h1>错误和警告窗口</h1></div>
	
	<div id="contents">
	<p>
		当某些操作期间发生错误或警告时，它们会在此窗口中报告。如果此窗口没有自动显示，你可以在“工具”菜单中找到它，或按默认按键 F11。点击<b>复制所选</b>按钮可将所选错误复制到剪贴板。点击<b>清除</b>按钮可从窗口中移除所有错误。<br />
		<br />
		你可以勾选<b>发生错误时显示此窗口</b>选项，以便在加载地图等操作后发生错误时自动打开此窗口。
	</p>
	</div>
</body>
