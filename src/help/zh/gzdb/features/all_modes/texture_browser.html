  <table width="100%" border="0" cellspacing="3" cellpadding="3">
    <tr>
      <td valign="top">图像浏览器会显示 Folder、PK3 和 PK7 资源的目录结构，让你可以更轻松地对贴图（Texture）进行分组和查找。<br />
        你可以按贴图尺寸筛选贴图。如果当前游戏配置（Game Configuration）支持混合使用贴图和平面贴图（Flat），你可以使用以下下拉列表按图像类型筛选贴图：<br />
        <img src="texture_types.jpg" alt=""/><br />
        <br />
        <strong>技术说明：</strong><br />
        对于在 TEXTURES lump 中定义的贴图，将使用第一个补丁（patch）的位置作为贴图路径。</td>
      <td><img src="texture_browser.jpg"/></td>
    </tr>
