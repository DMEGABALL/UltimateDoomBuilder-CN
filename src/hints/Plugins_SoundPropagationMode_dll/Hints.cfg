class SoundPropagationMode
group general
"此模式显示声音能在哪些扇区之间传播。高亮一个扇区即可查看声音可以自由传播到的位置（默认颜色：绿色），以及哪些扇区位于单条隔音线段之后（默认颜色：黄色）。声音无法传播到（默认）灰色的扇区。若没有高亮任何扇区，则每个声音传播区域会以不同颜色显示"
"按住 <k>builder_pan_view</k> 并移动鼠标可平移视图"
"按 <k>builder_classicselect</k> 切换高亮线段的隔音标志"
"按 <k>soundpropagationmode_setleakfinderstart</k> 设置起始扇区，按 <k>soundpropagationmode_setleakfinderend</k> 设置结束扇区，以查找两者之间的声音泄漏。根据地图大小，查找泄漏可能需要一些时间。"
"按 <k>builder_clearselection</k> 清除用于查找声音泄漏的起始和结束扇区"
"按 <k>soundpropagationmode_soundpropagationcolorconfiguration</k> 或使用工具栏中的按钮配置颜色"
