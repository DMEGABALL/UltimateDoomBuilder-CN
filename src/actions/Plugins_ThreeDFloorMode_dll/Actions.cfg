{
	title = "绘制倾斜顶点";
	category = "threedfloorplugin";
	description = "在鼠标光标位置绘制倾斜顶点。";
	allowkeys = true;
	allowmouse = true;
	allowscroll = true;
	disregardshift = true;
	disregardcontrol = true;
	default = 1; // Left mouse button
}

