<body>
	
	
	
	<div id="gz_title">
	  <h1>渲染工具栏</h1>
	</div>
	
	<div id="contents">
    <img src="menu_renderingtoolbar.jpg" />
    <p><strong>渲染工具栏</strong>允许你切换若干增强渲染功能：</p>
    <ol>
      <li>用于选择<a href="../../../e_visual.html">视觉模式</a>中使用的动态光源渲染模式。</li>
      <li>用于选择模型渲染模式。</li>
      <li>切换<a href="../../../e_visual.html">视觉模式</a>中的雾效渲染。</li>
      <li>切换<a href="../../../e_visual.html">视觉模式</a>中的天空渲染。</li>
      <li>切换<a href="../all_modes/event_lines.html">事件线</a>。</li>
      <li>切换<a href="../visual_mode/visual_verts.html">可视顶点</a>在<a href="../../../e_visual.html">视觉模式</a>中的显示（仅限 UDMF）。</li>
      </ol>
    <p>这些设置中的大多数也可以通过“<strong>渲染</strong>”类别中的动作或相应的<strong>视图菜单</strong>项来切换。<br />
    你可以使用“<strong>切换增强效果</strong>”动作来切换渲染效果。</p>
</div>
</body>
