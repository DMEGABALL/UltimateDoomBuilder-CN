<body>
	
	
	
	<div id="gz_title">
	  <h1>同步选区</h1>
</div>
	
<div id="contents">
  <p>在从 2D 编辑切换到视觉模式（以及切回）时，你可以保留在线段、扇区和物件模式下所做的任何选择。要做到这一点，请在进入或离开视觉模式时按住 <strong>Shift</strong>（默认即为 <strong>Shift-Q</strong>）。你也可以通过启用<strong> 首选项 -&gt; 编辑 -&gt; &quot;在视觉模式（Visual Mode）与经典模式之间同步选择&quot;</strong>设置来反转此行为。启用该设置后，按住 <strong>Shift</strong> 将忽略选区。</p>
</div>
</body>
