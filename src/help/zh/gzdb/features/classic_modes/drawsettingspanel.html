<body>

	
	
	<div id="gz_title">
	  <h1>绘制设置面板</h1>
	</div>
	
	<div id="contents">
<div style="float:right"><img src="drawsettingspanel.jpg" alt="" width="285" height="578" /></div>
<p> 默认情况下，当新扇区与现有扇区重叠或接触时，编辑器在绘制新扇区时会使用该扇区的贴图、亮度和地板/天花板高度。你可以使用绘制设置面板来覆盖这一行为。</p>
<p>此外，你还可以使用此面板移除当前选中的地图对象上的贴图，或用当前选定的覆盖值替换这些贴图。</p>
</div>
</body>
