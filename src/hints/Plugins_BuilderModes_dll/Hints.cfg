class CurveLinedefsMode
group general
"<b>左键拖动</b>或使用 <k>buildermodes_increasebevel</k> 和 <k>buildermodes_decreasebevel</k> 改变曲线深度。拖动时按住 <b>Shift</b> 以 1 个地图单位为步长改变"
"<b>右键拖动</b>或使用 <k>buildermodes_rotateclockwise</k> 和 <k>buildermodes_rotatecounterclockwise</k> 改变曲线的凸出程度。拖动时按住 <b>Shift</b> 以 1 度为步长改变"
