	<p>
		Doom Builder 的用户界面由一个主编辑窗口构成，大部分地图编辑工作都在其中完成。Doom Builder 还有一个用于脚本编写的窗口，以及多个内置对话框，用于编辑和设置你的偏好选项等等。参考手册的这一部分将帮助你了解每个窗口上的所有按钮和控件。
