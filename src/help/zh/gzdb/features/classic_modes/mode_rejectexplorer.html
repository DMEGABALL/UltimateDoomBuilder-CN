<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	
	<title>Reject 浏览器模式</title>
	
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" type="text/css" href="../../../default.css" media="screen" title="Default" />
</head>
<body>
	
	
	
	<div id="gz_title"><h1>Reject 浏览器模式</h1></div>
	
	<div id="contents">
	<p>
		此模式让你查看地图的 reject 数据。在 Doom 和 Hexen 格式中可用<br>
		<b>菜单路径：</b>模式 -&gt; Reject 浏览器模式<br>
		<b>默认按键：</b>无。<br>
		<br>
		关于地图 reject 数据的信息。<br>
		<br>
		<b>颜色（默认）：</b>
		<table border="1" cellpadding="5" cellspacing="0">
			<tr>
				<th>颜色</th>
				<th>说明</th>
			</tr>
			<tr>
				<td>灰色</td>
				<td>高亮扇区与该扇区之间没有视线</td>
			</tr>
			<tr>
				<td>浅绿色</td>
				<td>当前高亮的扇区</td>
			</tr>
			<tr>
				<td>深绿色</td>
				<td>高亮扇区与该扇区之间存在双向视线</td>
			</tr>
			<tr>
				<td>黄色</td>
				<td>存在从高亮扇区到该扇区的单向视线</td>
			</tr>
			<tr>
				<td>紫色</td>
				<td>存在从该扇区到高亮扇区的单向视线</td>
			</tr>
		</table>
		<p>可以在设置中自定义颜色（参见工具栏中的按钮）</p>
	</p>
</div>
</body>
</html>
