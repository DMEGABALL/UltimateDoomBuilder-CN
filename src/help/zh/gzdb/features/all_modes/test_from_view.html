	<div id="gz_title">
	  <h1>从视角位置测试地图</h1>
</div>
	
<div id="contents">
  <p>GZDB 允许你从地图中任意有效位置测试地图。其工作方式如下：</p>
  <p>假设你想在 (G)ZDoom 中查看那个秘密区域：<br />
  <img src="synch_cam1.jpg" alt="" width="736" height="512" /></p>
  <p>将鼠标光标移到你希望在游戏中出现的位置，然后使用&quot;<strong>从当前位置测试地图（Test map from current position）</strong>&quot;动作（默认按键为 <strong>Ctrl-F9</strong>）。你将出现在那里：</p>
  <p><img src="test_from_view2.jpg" alt="" width="740"/></p>
  <p>这同样可以在视觉模式（Visual Mode）下使用。你将出现在视觉模式相机所在的位置：</p>
  <p><img src="test_from_view3.jpg" alt="" width="740" height="515" /></p>
  <p><img src="test_from_view4.jpg" alt="" width="740"/></p>
</div>
</body>
