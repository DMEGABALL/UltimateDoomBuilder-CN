<body>
	
	
	
	<div id="title"><h1>关于编辑模式</h1></div>
	
	<div id="contents">
	<p>
		使用 Doom Builder 时，你总是在某个特定的编辑模式中工作，该模式取决于你想做什么，并允许相同的鼠标按键和键盘控件用于不同用途。你会发现自己一直在切换编辑模式，因此记住自己为这些模式分配了哪些按键是很有益的。
	</p>
