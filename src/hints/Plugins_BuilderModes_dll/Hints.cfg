class BaseVisualMode
group general
"使用 <k>builder_moveforward</k>、<k>builder_movebackward</k>、<k>builder_moveleft</k> 和 <k>builder_moveright</k> 移动。按住 <b>Shift</b> 可使速度加倍"
"使用 <k>builder_moveup</k> 和 <k>builder_movedown</k> 上下移动"
"按 <k>builder_gztogglevisualvertices</k> 切换顶点控制柄的渲染（仅 UDMF）"

group things
"使用 <k>builder_moveforward</k>、<k>builder_movebackward</k>、<k>builder_moveleft</k> 和 <k>builder_moveright</k> 移动。按住 <b>Shift</b> 可使速度加倍"
"使用 <k>builder_moveup</k> 和 <k>builder_movedown</k> 上下移动"
"按 <k>builder_gztogglevisualvertices</k> 切换顶点控制柄的渲染（仅 UDMF）"
"按 <k>builder_insertitem</k> 在当前光标位置插入物件"
"按 <k>builder_visualselect</k> 选择高亮的物件"
"按 <k>builder_clearselection</k> 清除选择"
"按 <k>builder_deleteitem</k> 删除选中的物件"
"使用 <k>buildermodes_raisesector8</k> 和 <k>buildermodes_lowersector8</k> 将选中/目标物件的高度改变 8 个地图单位"
"使用 <k>buildermodes_lowersectortonearest</k> 和 <k>buildermodes_raisesectortonearest</k> 将选中/目标物件对齐到地板或天花板"
"使用 <k>builder_movethingfwd</k>、<k>builder_movethingback</k>、<k>builder_movethingleft</k> 和 <k>builder_movethingright</k> 移动选中的物件"
"使用 <k>buildermodes_scaleupx</k>、<k>buildermodes_scaledownx</k>、<k>buildermodes_scaleupy</k> 和 <k>buildermodes_scaledowny</k> 缩放选中的物件（仅 UDMF）"
"按 <k>builder_placethingatcursor</k> 将选中的物件移动到光标位置"
"按 <k>buildermodes_showvisualthings</k> 循环切换物件的不同显示方式"

group sidedefs
"使用 <k>builder_moveforward</k>、<k>builder_movebackward</k>、<k>builder_moveleft</k> 和 <k>builder_moveright</k> 移动。按住 <b>Shift</b> 可使速度加倍"
"使用 <k>builder_moveup</k> 和 <k>builder_movedown</k> 上下移动"
"按 <k>builder_gztogglevisualvertices</k> 切换顶点控制柄的渲染（仅 UDMF）"
"按 <k>builder_insertitem</k> 在当前光标位置插入物件"
"按 <k>builder_visualselect</k> 选择高亮的表面。按住 <b>Shift</b> 可选择相邻的同贴图表面。按住 <b>Ctrl</b> 可选择相邻的同高度表面。按住 <b>Alt</b> 可在遇到已选中的表面时停止继续选择相邻表面"
"按 <k>builder_deleteitem</k> 移除选中表面的贴图"
"使用 <k>buildermodes_movetextureleft</k>、<k>buildermodes_movetextureright</k>、<k>buildermodes_movetextureup</k> 和 <k>buildermodes_movetexturedown</k> 将贴图偏移改变 1 mp。"
"使用 <k>buildermodes_movetextureleft8</k>、<k>buildermodes_movetextureright8</k>、<k>buildermodes_movetextureup8</k> 和 <k>buildermodes_movetexturedown8</k> 按当前网格大小改变贴图偏移"
"使用 <k>buildermodes_scaleupx</k>、<k>buildermodes_scaledownx</k>、<k>buildermodes_scaleupy</k> 和 <k>buildermodes_scaledowny</k> 缩放选中的贴图（仅 UDMF）"
"按 <k>buildermodes_textureselect</k> 打开贴图浏览器"
"使用 <k>buildermodes_texturecopy</k>、<k>buildermodes_texturepaste</k> 和 <k>buildermodes_floodfilltextures</k> 复制、粘贴高亮的贴图，并对其进行泛洪填充"
"使用 <k>buildermodes_texturecopyoffsets</k> 和 <k>buildermodes_texturepasteoffsets</k> 复制和粘贴贴图偏移"
"使用 <k>buildermodes_visualautoalignx</k>、<k>buildermodes_visualautoalign</k> 或 <k>buildermodes_visualautoalign</k> 在 X、Y 和 XY 轴上自动对齐贴图"
"使用 <k>buildermodes_visualfittextures</k> 将贴图的宽度或高度适配到选中的表面（仅 UDMF）"
"使用 <k>buildermodes_resettexture</k> 重置全局贴图偏移"
"使用 <k>buildermodes_resettextureudmf</k> 重置局部贴图偏移和缩放（仅 UDMF）"
"使用 <k>buildermodes_toggleupperunpegged</k> 或 <k>buildermodes_togglelowerunpegged</k> 切换上部不固定（Upper Unpegged）或下部不固定（Lower Unpegged）设置"

