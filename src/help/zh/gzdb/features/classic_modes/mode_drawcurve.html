	<div id="gz_title">
	  <h1>绘制曲线模式</h1>
	</div>
	
	<div id="contents">
	<p>
此模式让你绘制各种曲线形状。 <br>
<b>菜单路径：</b>模式 -&gt; 绘制曲线。<br>
<b>动作类别：</b>绘制。<br>
<b>默认按键：</b>Ctrl-Alt-D。<br>
<b>附加动作：</b>提高细分级别、降低细分级别。<br><br>
你可以按下 <strong>Ctrl-Alt-D</strong>（默认按键）激活此模式。<br>
按下模式面板上的"<strong>连续绘制</strong>"按钮，可在绘制完成后禁用自动切换回之前的编辑模式。<br>
按下模式面板上的"<strong>自动完成绘制</strong>"按钮，可在当前绘制的线段与已有关卡几何体构成闭合形状时自动完成绘制。<br>
你可以使用模式面板或&quot;<strong>提高细分级别</strong>&quot;和&quot;<strong>降低细分级别</strong>&quot;动作来控制曲线的精细程度：
