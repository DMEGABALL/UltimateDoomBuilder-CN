<body>
	
	
	
	<div id="gz_title"><h1>绘制矩形模式</h1></div>
	
	<div id="contents">
	<p>
此模式让你绘制各种矩形形状。<br>
<b>菜单路径：</b>模式 -&gt; 绘制矩形。<br />
<b>动作类别：</b>绘制。<br>
<b>默认按键：</b>Ctrl-Shift-D。<br>
<b>附加动作：</b>提高细分级别、降低细分级别、增大拐角斜切、减小拐角斜切。<br>
<br>
你可以按下 <strong>Ctrl-Shift-D</strong>（默认按键）激活此模式。<br>
按下模式面板上的"<strong>连续绘制</strong>"按钮，可在绘制完成后禁用自动切换回之前的编辑模式。<br>
你可以使用模式面板或&quot;<strong>提高/降低细分级别</strong>&quot;和&quot;<strong>增大/减小拐角斜切</strong>&quot;动作来改变拐角斜切量和细节级别：
<br>
<img src="draw_rectangle1.jpg" />
<br>
也支持负数的斜切值：
<br>
<img src="draw_rectangle2.jpg" />
<br>
使用&quot;<strong>增大/减小拐角斜切</strong>&quot;动作时，斜切增量基于当前网格大小。</p>
</div>
