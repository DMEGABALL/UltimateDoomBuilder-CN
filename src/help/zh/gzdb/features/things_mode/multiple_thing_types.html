<body>

	
	
	<div id="gz_title">
	  <h1>一次分配多个物件类型</h1>
	</div>
	
	<div id="contents">
	<p>现在可以在物件编辑窗口中一次选择多个物件类型。如果这样做，每个选中的物件都会被随机分配一个从所选类型中选出的类型。<br /><br />
	  <strong>示例</strong>。假设你有一张典型的 slaughterwad，想增加一些怪物种类：<br />
	<img src="multithingtype1.jpg"/></p>
	  
	<p>选中所有怪物，然后选择多个怪物类型：<br />
	<img src="multithingtype2.jpg"/></p>   
	  
	<p>单击“确定”，就大功告成了：<br />   
	<img src="multithingtype3.jpg"/></p>
    </div>
</body>
</html>
