<body>
	
	
	
	<div id="title"><h1>网格设置窗口</h1></div>
	
	<div id="contents">
	<p>
		在此窗口中，你可以配置网格（Grid）和背景设置。点击<a href="w_mainwindow.html">状态栏</a>中的网格图标，或从“编辑”菜单中选择“网格设置”，即可访问此窗口。网格有助于对齐地图元素，而 64 地图像素的网格对 Doom 很重要，因为它决定了平面贴图的对齐方式。你可以在此窗口顶部更改要使用的网格大小。请注意，也可以通过<b>增大网格</b>和<b>减小网格</b>动作轻松更改网格。<br />
		<br />
		当你在一张图像上描绘以复制其形状时，背景会很有用。勾选<b>显示背景图像</b>复选框，并选择要用作背景图像的贴图、平面贴图或文件。你还可以更改偏移量和缩放比例。
	</p>
	</div>
</body>
