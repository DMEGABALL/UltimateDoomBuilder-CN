	<div id="title"><h1>简介</h1></div>
	
	<div id="contents">
	<p>
		Doom Builder 是一款先进且具有革命性的地图编辑器，适用于 Doom 以及基于 Doom 引擎的游戏，例如 Heretic、Hexen 和 Strife。这款编辑器针对 Doom 社区的不同游戏引擎具有高度的可扩展性。Doom Builder 在 Doom 社区中引入了 3D 编辑模式，至今仍是 Doom 关卡制作的领先编辑器。
		
		<h2>参考手册</h2>
		这是 Doom Builder 2 的参考手册。你可以使用本手册查阅编辑器的工作方式，以及特定模式和动作的作用。本手册不是教你如何制作地图的初学者教程。<br /><br />
        
        <strong>GZDoom Builder</strong> 的参考手册可在<a href="gz_introduction.html">此处</a>获取。
	</p>
	</div>
