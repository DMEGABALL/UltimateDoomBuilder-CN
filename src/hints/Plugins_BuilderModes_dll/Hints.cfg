// This is GZDB hints configuration file. It's dev-only stuff so bare minimum of boilerplate is present in the parser class
// (e.g. create your Hints.cfg exactly the way it's done here or face consequences).
// "class" should exactly match your classname; "group" can be anything. "general" and "multiselection" groups are shown automatically when appropriate.
// Supported tags are <b> for Bold and <br> for line break. Action name inside of <k> tag will insert keyboard shortcut for given action in bold.
// Only single-line comments are supported.

class VerticesMode
group general
"按住 <k>builder_pan_view</k> 并移动鼠标可平移视图"
"按 <k>builder_classicselect</k> 选择顶点"
"按住 <k>builder_classicselect</k> 并拖动可使用矩形选择"
"按 <k>builder_clearselection</k> 清除选择"
"按 <k>builder_insertitem</k> 插入新顶点"
"按 <k>builder_deleteitem</k> 删除选中的顶点"
"按 <k>builder_dissolveitem</k> 删除选中的顶点，并尽量保留周围的几何结构"
"按 <k>builder_classicedit</k> 编辑当前选择的属性"
"使用 <k>builder_griddec</k> 和 <k>builder_gridinc</k> 改变网格大小"
"按 <k>buildermodes_drawlinesmode</k> 开始绘制线段"
"更多操作请查看 <b>'顶点（Vertices）'</b> 菜单"

group multiselection
"按住 <b>Shift</b> 切换添加式选择"
"按住 <b>Ctrl</b> 启用减去式选择"
"按住 <b>Ctrl-Shift</b> 将新选择与已有选择求交集"


class LinedefsMode
group general
"按住 <k>builder_pan_view</k> 并移动鼠标可平移视图"
"按 <k>builder_classicselect</k> 选择线段"
"按住 <k>builder_classicselect</k> 并拖动可使用矩形选择"
"按 <k>builder_clearselection</k> 清除选择"
"按 <k>builder_deleteitem</k> 删除选中的线段"
"按 <k>builder_dissolveitem</k> 删除选中的线段，并尽量保留周围的几何结构"
"按 <k>builder_classicedit</k> 编辑当前选择的属性"
"使用 <k>builder_griddec</k> 和 <k>builder_gridinc</k> 改变网格大小"
"按 <k>buildermodes_drawlinesmode</k> 或 <k>builder_insertitem</k> 开始绘制线段"
"按 <k>buildermodes_fliplinedefs</k> 翻转选中的线段，同时让各个边（sidedef）保持在正确的一侧"
"按 <k>buildermodes_selectsinglesided</k> 将选择中仅单面的线段保留为选中状态"
"按 <k>buildermodes_selectdoublesided</k> 将选择中仅双面的线段保留为选中状态"
"更多操作请查看 <b>'线段（Linedefs）'</b> 菜单"

group multiselection
"按住 <b>Shift</b> 切换添加式选择"
"按住 <b>Ctrl</b> 启用减去式选择"
"按住 <b>Ctrl-Shift</b> 将新选择与已有选择求交集"
"按住 <b>Alt</b> 启用物件的（取消）选择"


class SectorsMode
group general
"按住 <k>builder_pan_view</k> 并移动鼠标可平移视图"
"按 <k>builder_classicselect</k> 选择扇区。按住 <b>Alt</b> 可（取消）选择该扇区内的物件"
"按住 <k>builder_classicselect</k> 并拖动可使用矩形选择"
"按 <k>builder_clearselection</k> 清除选择"
"按 <k>builder_deleteitem</k> 删除选中的扇区"
"按 <k>builder_classicedit</k> 编辑当前选择的属性"
"使用 <k>builder_griddec</k> 和 <k>builder_gridinc</k> 改变网格大小"
"按 <k>buildermodes_joinsectors</k> 连接两个或多个选中的扇区，并保留所有线段"
"按 <k>buildermodes_mergesectors</k> 合并两个或多个选中的扇区，并移除共用的线段"
"按 <k>buildermodes_gradientbrightness</k> 在从第一个到最后选中的扇区之间，为所有选中扇区创建亮度或颜色渐变"
"按 <k>buildermodes_gradientfloors</k> 在从第一个到最后选中的扇区之间，为所有选中扇区创建地板高度渐变"
"按 <k>buildermodes_gradientceilings</k> 在从第一个到最后选中的扇区之间，为所有选中扇区创建天花板高度渐变"
"按 <k>buildermodes_makedoor</k> 根据高亮或选中的扇区创建门"
"按 <k>buildermodes_drawlinesmode</k> 或 <k>builder_insertitem</k> 开始绘制线段"
"更多操作请查看 <b>'扇区（Sectors）'</b> 菜单"

group multiselection
"按住 <b>Shift</b> 切换添加式选择"
"按住 <b>Ctrl</b> 启用减去式选择"
"按住 <b>Ctrl-Shift</b> 将新选择与已有选择求交集"
"按住 <b>Alt</b> 启用物件的（取消）选择"


