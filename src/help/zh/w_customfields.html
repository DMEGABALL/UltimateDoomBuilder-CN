<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	
	<title>自定义字段编辑器</title>
	
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<link rel="stylesheet" type="text/css" href="default.css" media="screen" title="Default" />
</head>
<body>
	
	
	
	<div id="title"><h1>自定义字段编辑器</h1></div>
	
	<div id="contents">
	<p>
		UDMF 格式允许在地图的每个元素上设置任意数量的自定义属性。使用自定义字段编辑器，你可以编辑已知属性，并自行添加自定义属性。游戏配置中包含源端口支持的已知属性，这些属性会自动显示在列表中。灰色的项是已知的，但尚未设置（因此使用其默认值）。要添加自己的自定义属性，你可以点击<b>点击以添加自定义字段</b>文本，然后输入新属性的名称。之后你可以更改类型并设置其值。要移除自定义属性，只需选中它并按 Delete 键。已知属性无法删除，在选中已知属性时按 Delete 键只会将其重置回默认值。
	</p>
	</div>
</body>
