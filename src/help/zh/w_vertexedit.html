	<title>顶点属性窗口</title>

<body>
	
	
	
	<div id="title"><h1>顶点属性窗口</h1></div>
	
	<div id="contents">
	<p>
		此对话框允许你编辑顶点的精确坐标。当选中多个顶点时，如果某些字段在所选元素之间有所不同，这些字段可能会显示为灰色或空白。在灰色或空白字段中设置值将应用于整个选择。
		
		<h2>自定义</h2>
		此选项卡允许你编辑顶点上的自定义字段。仅在 UDMF 格式中可用。更多信息请参见<a href="w_customfields.html">自定义字段编辑器</a>。
	</p>
	</div>
</body>
