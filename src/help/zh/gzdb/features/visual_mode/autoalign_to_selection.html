<body>

<div id="gz_title">
  <h1>“贴图自动对齐到所选对象”动作</h1>
</div>
<div id="contents">
  <p><strong>动作名称：</strong>贴图自动对齐到所选对象（X）（Auto-align Textures to Selection (X)）、贴图自动对齐到所选对象（Y）（Auto-align Textures to Selection (Y)）、贴图自动对齐到所选对象（X 和 Y）（Auto-align Textures to Selection (X and Y)）<br />
    <b>动作类别：</b>视觉模式<br />
    <b>默认按键：</b>无</p>
  <p>这些动作会将未选中的贴图对齐到已选中的贴图。<br />
  假设你有一个布满柱子的房间，你想将贴图对齐到所有柱子上：<br />
  <img src="align_to_selection1.jpg"/></p>
  <p>选中每个柱子的一个侧面：<br />
  <img src="align_to_selection2.jpg"/></p>
  <p>然后使用“<strong>贴图自动对齐到所选对象（X）”</strong>动作：<br />
  <img src="align_to_selection3.jpg"/></p>
</div>
</body>
</html>
